name: Check Amazon Website

on:
  schedule:
    - cron: '*/15 * * * *' 
  workflow_dispatch:        

jobs:
  check-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar si Amazon responde correctamente
        run: |
          URL="https://www.amazon.com"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$RESPONSE" -ne 200 ]; then
            echo "❌ Amazon parece estar caído. Código HTTP: $RESPONSE"
            exit 1
          else
            echo "✅ Amazon está funcionando. Código HTTP: $RESPONSE"
          fi
